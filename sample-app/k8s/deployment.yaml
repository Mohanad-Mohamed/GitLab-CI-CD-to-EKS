apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-sample-app
  labels:
    app: gitlab-sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitlab-sample-app
  template:
    metadata:
      labels:
        app: gitlab-sample-app
    spec:
      containers:
      - name: gitlab-sample-app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 3000
        env:
        - name: IMAGE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
