stages:
  - install
  - build
  - test
  - build_push_gitlab
  - deploy

variables:
  IMAGE_NAME: "registry.gitlab.com/$CI_PROJECT_PATH:$CI_PIPELINE_IID"
  DOCKER_IMAGE_NAME: "$CI_REGISTRY_USER/$CI_PROJECT_NAME:$CI_PIPELINE_IID"

install_job:
  stage: install
  image: node:22-alpine
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

build_job:
  stage: build
  image: node:22-alpine
  dependencies:
    - install_job
  script:
    - echo "Building application..."
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

test_job:
  stage: test
  image: node:22-alpine
  dependencies:
    - install_job
  script:
    - npm test
  allow_failure: true

build_push_gitlab_job:
  stage: build_push_gitlab
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker build -t $IMAGE_NAME .
    - docker images
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login registry.gitlab.com -u "$CI_REGISTRY_USER" --password-stdin
    - docker push $IMAGE_NAME
  only:
    - main
    - master

deploy_job:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - echo "Deploying to Kubernetes..."
    - kubectl config use-context "$KUBE_CONTEXT"
    - sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_NAME|g" k8s/deployment.yaml
    - kubectl apply -f k8s/deployment.yaml
    - kubectl apply -f k8s/service.yaml
  only:
    - main
    - master
  when: manual
